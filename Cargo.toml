[package]
name = "droid-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Android and Kotlin news collector exposed as a CLI and MCP server"

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
feed-rs = "2.4.0"
futures-util = "0.3.31"
html2text = "0.17.1"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots", "charset", "gzip", "brotli", "stream"] }
rmcp = { version = "3.4.0", features = ["client", "server", "transport-io"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.7"
